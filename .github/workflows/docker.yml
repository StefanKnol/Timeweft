name: Docker

# Build the image and push it to the author's registry.
#
# The image holds the app and no canon, so it carries nothing private. It is still pushed only
# to the registry named by the repository's own secrets.
#
# Three secrets: DOCKER_REPOSITORY (the registry host alone, with no scheme and no path),
# DOCKER_USERNAME and DOCKER_PASSWORD. Where DOCKER_REPOSITORY is not set the image is built
# and not pushed, and the run says so, so that a repository without a registry yet stays green.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # IMAGE_NAMESPACE:
  #   empty  - use the GitHub owner, in lower case (an image reference must be lower case)
  #   none   - no namespace at all, for a registry that takes <host>/<image> directly
  #   or any name the image should be published under
  IMAGE_NAMESPACE: none
  IMAGE_NAME: timeweft

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The whole history, not the default single commit: the build number is the count of
      # commits, and a shallow clone counts one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The stamp the server reports on /health. The names are BUILD_STAMP_VARIABLES in
      # apps/server/src/build-stamp.ts, and a test holds this file and the Dockerfile to them.
      - name: Stamp the build
        id: stamp
        run: |
          number=$(git rev-list --count HEAD)
          commit=$(git rev-parse --short=7 HEAD)
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$number" -lt 2 ]; then
            echo "::error::The build number came out as $number, which means the checkout was shallow."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          echo "Stamping build $number, $commit, $built_at."

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Nothing below echoes a secret. Only its shape is reported.
      - name: Work out where the image goes
        id: image
        env:
          DOCKER_REPOSITORY: ${{ secrets.DOCKER_REPOSITORY }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DOCKER_REPOSITORY" ]; then
            echo "::notice::DOCKER_REPOSITORY is not set, so the image is built and not pushed."
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "reference=timeweft" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$DOCKER_REPOSITORY" in
            *://*)
              echo "::error::DOCKER_REPOSITORY carries a scheme. Give the registry host alone."
              exit 1
              ;;
            */*)
              echo "::error::DOCKER_REPOSITORY contains a '/'. It holds the registry host alone; the namespace and the image name are set in this workflow."
              exit 1
              ;;
          esac
          case "$IMAGE_NAMESPACE" in
            "") namespace=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]') ;;
            none) namespace="" ;;
            *) namespace="$IMAGE_NAMESPACE" ;;
          esac
          if [ -n "$namespace" ]; then path="$namespace/$IMAGE_NAME"; else path="$IMAGE_NAME"; fi
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "reference=$DOCKER_REPOSITORY/$path" >> "$GITHUB_OUTPUT"
          echo "Publishing as <registry>/$path."

      - name: Log in to the registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REPOSITORY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Name the tags
        id: tags
        env:
          REFERENCE: ${{ steps.image.outputs.reference }}
          COMMIT: ${{ steps.stamp.outputs.commit }}
        run: |
          tags="$REFERENCE:$COMMIT"
          case "$GITHUB_REF" in
            refs/heads/main) tags="$tags,$REFERENCE:latest" ;;
            refs/tags/v*) tags="$tags,$REFERENCE:${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.image.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TIMEWEFT_BUILD_NUMBER=${{ steps.stamp.outputs.number }}
            TIMEWEFT_BUILD_COMMIT=${{ steps.stamp.outputs.commit }}
            TIMEWEFT_BUILT_AT=${{ steps.stamp.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
